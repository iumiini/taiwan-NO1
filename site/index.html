};

const money = n => {
  if (n == null) return null;
  if (n >= 1e12) return (n / 1e12).toFixed(2) + " 兆";
  if (n >= 1e8)  return (n / 1e8).toFixed(1) + " 億";
  if (n >= 1e4)  return (n / 1e4).toFixed(1) + " 萬";
  return n.toLocaleString("zh-TW");
};
const pct  = n => n == null ? null : (n > 0 ? "+" : "") + n.toFixed(2) + "%";
const num  = (n, d = 2) => n == null ? null : n.toLocaleString("zh-TW", { minimumFractionDigits: d, maximumFractionDigits: d });
const esc  = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dash = v => v == null ? '<span class="missing">未公布</span>' : v;

/* 資料裡的屬性色是為深色底挑的，白底需要壓深才有足夠對比 */
function darken(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const f = c => Math.round(c * (1 - amount)).toString(16).padStart(2, "0");
  return "#" + f((n >> 16) & 255) + f((n >> 8) & 255) + f(n & 255);
}

/* 氣場：本體色＝屬性，外圈環的疏密與濃度＝成交量，環的顏色＝當日漲跌。
   白底上不做霓虹光暈，改走標本圖的細線調性。 */
function drawAura(canvas, changePct, volumeRatio, tint, ink) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const size = 300;
  canvas.width = size * dpr; canvas.height = size * dpr;
  canvas.style.aspectRatio = "1 / 1";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);

  const cx = size / 2, cy = size / 2, core = 54;
  const priceColor = changePct >= 0 ? "#C8322A" : "#0E8A5F";
  const thickness = Math.max(0.3, Math.min(1.6, volumeRatio));
  const rings = Math.round(3 + thickness * 3);

  for (let i = rings; i >= 1; i--) {
    const r = core + 10 + i * 12 * Math.max(0.55, thickness);
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = priceColor;
    ctx.globalAlpha = 0.05 + (rings - i) / rings * 0.22 * thickness;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  const halo = ctx.createRadialGradient(cx, cy, core, cx, cy, core + 70 * thickness);
  halo.addColorStop(0, priceColor + "1F");
  halo.addColorStop(1, priceColor + "00");
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(cx, cy, core + 70 * thickness, 0, Math.PI * 2); ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, core, 0, Math.PI * 2);
  ctx.fillStyle = tint + "2E";
  ctx.fill();
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = ink;
  ctx.font = '700 30px ui-monospace, monospace';
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(canvas.dataset.symbol || "", cx, cy);
}

function drawRadar(canvas, stats, tint, ink) {
  const keys = ["hp", "atk", "matk", "spd", "mdef", "def"];
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const size = 260;
  canvas.width = size * dpr; canvas.height = size * dpr;
  canvas.style.aspectRatio = "1 / 1";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);

  const cx = size / 2, cy = size / 2, R = size / 2 - 34;
  const max = Math.max(...Object.values(stats)) * 1.12;
  const pt = (i, r) => {
    const a = -Math.PI / 2 + i * Math.PI / 3;
    return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  };

  for (let ring = 1; ring <= 4; ring++) {
    ctx.beginPath();
    keys.forEach((_, i) => {
      const [x, y] = pt(i, R * ring / 4);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.closePath();
    ctx.strokeStyle = ring === 4 ? "#DCC9A6" : "#EFE2C9";
    ctx.stroke();
  }
  keys.forEach((_, i) => {
    ctx.beginPath(); ctx.moveTo(cx, cy);
    const [x, y] = pt(i, R);
    ctx.lineTo(x, y);
    ctx.strokeStyle = "#EFE2C9"; ctx.stroke();
  });

  ctx.beginPath();
  keys.forEach((k, i) => {
    const [x, y] = pt(i, R * stats[k] / max);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.closePath();
  ctx.fillStyle = tint + "3D";
  ctx.fill();
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  keys.forEach((k, i) => {
    const [x, y] = pt(i, R * stats[k] / max);
    ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = ink; ctx.fill();
  });

  ctx.fillStyle = "#7A6E62";
  ctx.font = '600 11px system-ui, sans-serif';
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  keys.forEach((k, i) => {
    const [x, y] = pt(i, R + 19);
    ctx.fillText(STAT_META[k].name, x, y);
  });
}

function render(data) {

      <span class="vl">${v}</span>
      <span class="bar"><i style="width:${w}%"></i></span>

    ["atk",  "每股盈餘",       sm.eps != null ? num(sm.eps) + " 元" : null],

    ["spd",  "週轉率",         sm.turnover_ratio != null ? num(sm.turnover_ratio) + "%" : null]

  const auraCanvas = document.getElementById("aura");
  drawAura(auraCanvas, d.price.change_percent, d.aura.volume_ratio, tint, ink);
  drawRadar(document.getElementById("radar"), s.base_stats, tint, ink);
}

async function load() {
  const target = new URLSearchParams(location.search).get("symbol") || "2330";
  try {
    const idx = await fetch("./data/index.json").then(r => r.ok ? r.json() : Promise.reject());
    const [sp, dy, bal] = await Promise.all([
      fetch("./data/" + idx.files.species.path).then(r => r.json()),
      fetch("./data/" + idx.files.daily.path).then(r => r.json()),
      fetch("./data/" + idx.files.balance.path).then(r => r.json()).catch(() => ({}))
    ]);
    const species = sp.species.find(x => x.symbol === target);
    const daily = dy.monsters.find(x => x.symbol === target);
    if (!species || !daily) throw new Error("找不到 " + target);
    return {
      meta: { generation: sp.generation, season: sp.season,
              market_date: dy.market_date, fiscal_period: sp.fiscal_period },
      balance: bal, species, daily
    };
  } catch {
    return SNAPSHOT;
  }
}

load().then(render);
</script>
