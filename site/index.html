<style>
:root {
  --ground:     #E3EBE8;   /* 淡底：讓米色卡片浮出來 */
  --card:       #FBF3E6;
  --line:       #EADCC2;
  --text:       #413A34;
  --text-dim:   #7A6E62;
  --text-faint: #A2968A;
  --accent:      #F9A835;
  --accent-deep: #C67A12;
  --up:   #C8322A;
  --down: #0E8A5F;
  --serif: "Songti TC", "Noto Serif TC", "Source Han Serif TC", "SimSun", serif;
  --sans:  "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono:  ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--sans);
       line-height: 1.6; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 1.4rem 16px 3rem; }

.masthead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .6rem 1rem;
            border-bottom: 2px solid var(--accent); padding-bottom: .6rem; margin-bottom: 1rem; }
.masthead h1 { margin: 0; font-family: var(--serif); font-size: 1.5rem; letter-spacing: .04em; }
.masthead .meta { font-size: .8rem; color: var(--text-dim); }
.toolbar { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; margin-bottom: 1.2rem; font-size: .9rem; }
.toolbar select { font: inherit; padding: .3rem .6rem; border: 1px solid var(--line); border-radius: 6px;
                  background: var(--card); color: var(--text); }
.proto { background: #FDEFD6; border: 1px dashed var(--accent-deep); color: var(--accent-deep);
         padding: .35rem .7rem; border-radius: 6px; font-size: .82rem; }

/* 卡片是固定比例設計：設計寬 240 單位，所有尺寸（含字級）都以卡片自身寬度換算。
   不論欄寬或裝置，卡片比例與文字比例一致，也不會折行。 */
:root { --u: calc(100cqw / 240); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }

.cardbox { container-type: inline-size; }
.mon { display: block; aspect-ratio: 240 / 388; text-decoration: none; color: inherit;
       border-radius: calc(var(--u) * 14); overflow: hidden;
       background-color: var(--card);
       background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .36  0 0 0 0 .25  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
       border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(80,60,30,.08), 0 6px 14px rgba(80,60,30,.07);
       transition: transform .15s, box-shadow .15s; }
.mon:hover, .mon:focus-visible { transform: translateY(-3px); box-shadow: 0 2px 4px rgba(80,60,30,.1), 0 12px 22px rgba(80,60,30,.13); outline: none; }
.mon:focus-visible { outline: 2px solid var(--accent-deep); outline-offset: 2px; }

.art { position: relative; margin: calc(var(--u) * 12) calc(var(--u) * 14) 0; border-radius: calc(var(--u) * 9);
       overflow: hidden; aspect-ratio: 1 / 1; background: #FFFDF8; border: 1px solid var(--line); }
.art canvas { width: 100%; height: 100%; display: block; }
.art .tag { position: absolute; top: calc(var(--u) * 7); left: calc(var(--u) * 7); font-size: calc(var(--u) * 11);
            line-height: 1.5; padding: 0 calc(var(--u) * 8); border-radius: 999px; white-space: nowrap;
            background: rgba(255,255,255,.85); border: 1px solid var(--line); color: var(--accent-deep); }
.art .wave { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: calc(var(--u) * 20); }

.head { padding: calc(var(--u) * 6) calc(var(--u) * 14) 0; }
.title { display: flex; justify-content: space-between; align-items: baseline; white-space: nowrap; }
.title .name { font-family: var(--serif); font-size: calc(var(--u) * 19); line-height: 1.25; font-weight: 700; letter-spacing: .03em; }
.title .no { font-family: var(--mono); font-size: calc(var(--u) * 14); color: var(--accent-deep); font-weight: 700; }
.sub { font-size: calc(var(--u) * 12); line-height: 1.4; color: var(--text-dim); white-space: nowrap; }

.facts { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 3) calc(var(--u) * 8);
         margin: calc(var(--u) * 6) calc(var(--u) * 14) 0; padding-top: calc(var(--u) * 6); border-top: 1px dashed var(--line); }
.facts div { min-width: 0; }
.facts dt { font-size: calc(var(--u) * 10); line-height: 1.2; color: var(--text-faint); letter-spacing: .06em; white-space: nowrap; }
.facts dd { margin: 0; font-size: calc(var(--u) * 13.5); line-height: 1.25; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.facts .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); }
.dim { color: var(--text-dim); font-weight: 400; }

.foot { margin-top: 2rem; font-size: .76rem; color: var(--text-faint); text-align: center; }
@media (max-width: 480px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
</style>

const RARITY  = { mythical: "幻獸", legendary: "傳說", epic: "史詩", rare: "稀有", common: "普通" };
const AURA    = { true_surge: "真暴走", true_weak: "真虛弱", phantom_surge: "幻影暴走", dormant: "蓄力假寐" };
const WEATHER = { excited: "亢奮", tailwind: "順風", depressed: "低迷" };
const PE_TAG  = { undervalued: "被低估", fair: "身價合理", popular: "人氣王", mysterious: "神秘系" };
const ELEMENT = { electric: "電", fire: "火", steel: "鋼", wind: "風", grass: "草",
                  water: "水", earth: "地", gold: "金", psychic: "超能力" };
const SHIELD  = { none: "無盾", silver: "銀盾", gold: "破淨金盾" };
const UP = "#C8322A", DOWN = "#0E8A5F", INK = "#C67A12";

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sign = n => (n > 0 ? "+" : "") + n.toFixed(2) + "%";

function drawArt(canvas, m) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const S = 220;                       // 邏輯尺寸固定為正方形，顯示時整體縮放
  canvas.width = S * dpr; canvas.height = S * dpr;
  const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr);
  const c = m.chg >= 0 ? UP : DOWN;
  const t = Math.max(0.3, Math.min(1.6, m.vr));
  const cx = S / 2, cy = S / 2 - 6, core = 36;
  const rings = Math.round(3 + t * 3);
  for (let i = rings; i >= 1; i--) {
    ctx.beginPath(); ctx.arc(cx, cy, core + 8 + i * 9 * Math.max(.55, t), 0, Math.PI * 2);
    ctx.strokeStyle = c; ctx.globalAlpha = .06 + (rings - i) / rings * .22 * t; ctx.lineWidth = 1; ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const g = ctx.createRadialGradient(cx, cy, core, cx, cy, core + 55 * t);
  g.addColorStop(0, c + "26"); g.addColorStop(1, c + "00");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, core + 55 * t, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, core, 0, Math.PI * 2);
  ctx.fillStyle = INK + "26"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = INK; ctx.font = "700 20px ui-monospace, monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(m.symbol, cx, cy);
}

function wave(color) {
  return `<svg class="wave" viewBox="0 0 240 18" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 9 Q15 0 30 9 T60 9 T90 9 T120 9 T150 9 T180 9 T210 9 T240 9 V18 H0Z" fill="${color}" opacity=".85"/></svg>`;
}

function card(m) {
  const cls = m.chg > 0 ? "up" : m.chg < 0 ? "down" : "";
  const w = m.weather.length ? m.weather.map(k => WEATHER[k]).join("、") : "平常";
  return `<div class="cardbox"><a class="mon" href="detail.html?symbol=${esc(m.symbol)}" aria-label="${esc(m.name)} ${esc(m.symbol)} 詳細頁">
    <div class="art"><canvas data-symbol="${esc(m.symbol)}"></canvas>
      <span class="tag">${RARITY[m.rarity] || ""}</span>${wave(m.chg >= 0 ? UP : DOWN)}</div>
    <div class="head">
      <div class="title"><span class="name">${esc(m.name)}</span><span class="no">${esc(m.symbol)}</span></div>
      <div class="sub">${ELEMENT[m.element] || ""}屬性 · 市值第 ${m.rank} 名</div>
    </div>
    <dl class="facts">
      <div><dt>漲跌</dt><dd class="num ${cls}">${sign(m.chg)}</dd></div>
      <div><dt>氣場</dt><dd>${AURA[m.aura]}</dd></div>
      <div><dt>均線天氣</dt><dd>${w}</dd></div>
      <div><dt>KD 護盾</dt><dd>${m.kd ? "有盾" : "無盾"}</dd></div>
      <div><dt>淨值盾</dt><dd>${SHIELD[m.nvs]}</dd></div>
      <div><dt>身價</dt><dd>${PE_TAG[m.pe_tag]}</dd></div>
    </dl></a></div>`;
}

const SORTS = {
  chg_desc: (a, b) => b.chg - a.chg || a.symbol.localeCompare(b.symbol),
  chg_asc:  (a, b) => a.chg - b.chg || a.symbol.localeCompare(b.symbol),
  rank:     (a, b) => a.rank - b.rank,
  symbol:   (a, b) => a.symbol.localeCompare(b.symbol)
};

function flatten(sp, dy) {
  const by = Object.fromEntries(sp.species.map(s => [s.symbol, s]));
  return dy.monsters.map(d => {
    const s = by[d.symbol];
    return { symbol: d.symbol, name: s.name, element: s.element, rarity: s.rarity, rank: s.rarity_rank,
             chg: d.price.change_percent, vr: d.aura.volume_ratio, aura: d.aura.quadrant,
             weather: d.weather, kd: !!(d.kd && d.kd.shield), nvs: d.net_value_shield.tier,
             pe_tag: d.valuation.pe_tag, pe: d.valuation.pe };
  });
}

async function load() {
  try {
    const idx = await fetch("./data/index.json").then(r => r.ok ? r.json() : Promise.reject());
    const [sp, dy] = await Promise.all([
      fetch("./data/" + idx.files.species.path).then(r => r.json()),
      fetch("./data/" + idx.files.daily.path).then(r => r.json())
    ]);
    return { market_date: dy.market_date, season: sp.season, monsters: flatten(sp, dy) };
  } catch { return SNAPSHOT; }
}

load().then(data => {
  const all = new URLSearchParams(location.search).get("all") === "1";
  let list = data.monsters;
  if (!all) { list = list.filter(m => m.symbol === "2330"); document.getElementById("proto").hidden = false; }
  document.getElementById("meta").textContent = `${data.season}　·　市場日 ${data.market_date}`;
  const sel = document.getElementById("sort");
  const grid = document.getElementById("grid");
  const draw = () => {
    const rows = list.slice().sort(SORTS[sel.value]);
    grid.innerHTML = rows.map(card).join("");
    const by = Object.fromEntries(rows.map(m => [m.symbol, m]));
    grid.querySelectorAll("canvas").forEach(cv => drawArt(cv, by[cv.dataset.symbol]));
    document.getElementById("count").textContent = `共 ${rows.length} 檔`;
  };
  sel.addEventListener("change", draw);
  draw();
});
